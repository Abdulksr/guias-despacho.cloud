spring.application.name=guias-despacho-cloud

server.port= 8080

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


spring.datasource.url=jdbc:h2:mem:guias_despacho_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_BUCKET_NAME:tu-bucket-guias-despacho}

aws.access-key-id=${AWS_ACCESS_KEY_ID:tu_access_key_local}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:tu_secret_key_local}
aws.session-token=${AWS_SESSION_TOKEN:}

${EFS_MOUNT_PATH:/mnt/efs/guias-temporales/}